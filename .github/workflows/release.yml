name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Build app bundle
        run: |
          go build -o session-keeper .
          ./session-keeper --build-bundle "Session Keeper.app"

      - name: Package
        run: ditto -c -k --keepParent "Session Keeper.app" session-keeper-macos-arm64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: session-keeper-macos-arm64.zip
          generate_release_notes: true
